{% extends "base.html" %}
{% block content %}
<div class="account-layout">
  {% include "account/_nav.html" %}
  <div style="display:flex;flex-direction:column;gap:16px;">
    <div class="card">
      <h1 style="margin-top:0;font-size:1.25rem;">اطلاعات حساب کاربری</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="profile">
        <div class="form-row">
          <div class="form-group">
            <label>نام و نام خانوادگی</label>
            <input type="text" name="full_name" value="{{ current_user.full_name }}" class="form-control" required>
          </div>
          <div class="form-group">
            <label>ایمیل</label>
            <input type="email" name="email" value="{{ current_user.email or '' }}" class="form-control" dir="ltr">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">ذخیره تغییرات</button>
      </form>
    </div>

    <div class="card">
      <h2 style="margin-top:0;font-size:1.1rem;">تغییر / تایید شماره موبایل (با کد پیامکی)</h2>
      <p style="font-size:0.86rem;color:var(--text-muted);">موبایل فعلی: <strong dir="ltr">{{ current_user.mobile or 'ثبت نشده' }}</strong></p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="change_mobile">
        <div class="form-row">
          <div class="form-group">
            <label>شماره موبایل جدید</label>
            <div style="display:flex;gap:6px;">
              <input type="tel" id="acc-mobile" name="mobile" class="form-control" dir="ltr" placeholder="09123456789" required>
              <button type="button" class="btn btn-accent btn-sm" data-send-otp data-mobile-input="#acc-mobile" data-purpose="mobile_change" data-status-el="#acc-otp-msg">ارسال کد</button>
            </div>
            <div id="acc-otp-msg" class="alert alert-info" style="display:none;margin-top:6px;padding:6px 10px;font-size:0.82rem;"></div>
          </div>
          <div class="form-group">
            <label>کد تایید ۶ رقمی</label>
            <input type="text" name="otp_code" class="form-control" dir="ltr" maxlength="6" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">تایید و تغییر موبایل</button>
      </form>
    </div>

    <div class="card">
      <h2 style="margin-top:0;font-size:1.1rem;">تنظیم / تغییر رمز عبور</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="set_password">
        <div class="form-row">
          <div class="form-group">
            <label>رمز عبور جدید</label>
            <input type="password" name="password" class="form-control" dir="ltr" required>
          </div>
          <div class="form-group">
            <label>تکرار رمز عبور</label>
            <input type="password" name="password_confirm" class="form-control" dir="ltr" required>
          </div>
        </div>
        <button type="submit" class="btn btn-outline btn-sm">ذخیره رمز عبور</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
