{% extends "base.html" %}
{% block title %}بازیابی رمز عبور — {{ store_name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h1>بازیابی رمز عبور</h1>
      <p>شماره موبایل حساب خود را وارد کنید تا کد بازیابی ارسال شود.</p>
    </div>
    <form method="post" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="mobile">شماره موبایل <span class="req">*</span></label>
        <input type="tel" id="mobile" name="mobile" value="{{ mobile }}" required pattern="09[0-9]{9}" maxlength="11" inputmode="numeric" autocomplete="tel">
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-3">ارسال کد بازیابی</button>
    </form>
    <div class="auth-footer"><a href="{{ url_for('auth.login') }}">بازگشت به ورود</a></div>
  </div>
</div>
{% endblock %}
