{% extends "base.html" %}
{% block title %}تعیین رمز عبور جدید — {{ store_name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h1>تعیین رمز عبور جدید</h1>
      <p>کد ارسال‌شده به <strong dir="ltr">{{ mobile }}</strong> را وارد کرده و رمز جدید را تعیین کنید.</p>
    </div>
    <form method="post" action="{{ url_for('auth.reset_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="code">کد تأیید <span class="req">*</span></label>
        <input type="text" id="code" name="code" required inputmode="numeric" maxlength="{{ settings.otp_length }}" autocomplete="one-time-code">
      </div>
      <div class="field mt-2">
        <label for="password">رمز عبور جدید <span class="req">*</span></label>
        <input type="password" id="password" name="password" required minlength="{{ settings.password_min_length }}" autocomplete="new-password">
      </div>
      <div class="field mt-2">
        <label for="password_confirm">تکرار رمز جدید <span class="req">*</span></label>
        <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-3">ذخیره رمز عبور</button>
    </form>
    <div class="auth-footer"><a href="{{ url_for('auth.forgot_password') }}">ارسال دوباره کد</a></div>
  </div>
</div>
{% endblock %}
