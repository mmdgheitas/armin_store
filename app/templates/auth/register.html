{% extends "base.html" %}
{% block content %}
<div style="max-width:500px;margin:32px auto;">
  <div class="card">
    <h1 style="margin-top:0;font-size:1.35rem;">ثبت‌نام در {{ site.site_name }}</h1>
    <form method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>نام و نام خانوادگی</label>
        <input type="text" name="full_name" value="{{ form_data.get('full_name', '') }}" class="form-control" required>
      </div>
      <div class="form-group">
        <label>ایمیل</label>
        <input type="email" name="email" value="{{ form_data.get('email', '') }}" class="form-control" dir="ltr" required>
      </div>
      <div class="form-group">
        <label>شماره موبایل (اختیاری)</label>
        <input type="tel" name="mobile" value="{{ form_data.get('mobile', '') }}" class="form-control" dir="ltr" placeholder="09123456789">
      </div>
      <div class="form-group">
        <label>رمز عبور (حداقل ۸ کاراکتر شامل حرف انگلیسی و عدد)</label>
        <input type="password" name="password" class="form-control" dir="ltr" required>
      </div>
      <div class="form-group">
        <label>تکرار رمز عبور</label>
        <input type="password" name="password_confirm" class="form-control" dir="ltr" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">ایجاد حساب کاربری</button>
    </form>
    <div style="margin-top:14px;text-align:center;font-size:0.9rem;">
      قبلاً ثبت‌نام کرده‌اید؟ <a href="{{ url_for('auth.login') }}" style="color:var(--primary);font-weight:700;">ورود</a>
    </div>
  </div>
</div>
{% endblock %}
